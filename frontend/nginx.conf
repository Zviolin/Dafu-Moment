# DAFU MOMENT 前端 Nginx：SPA 路由 + /api 反代后端 + /img 反代 MinIO（静态缓存头）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 公网暴露基础安全响应头（不含 HSTS：本容器只提供 HTTP，TLS 由隧道/前置代理终结）
    # 注意：Nginx 的 add_header 不与父级合并——location 内一旦有自己的 add_header，server 级就会失效，
    # 因此下面每个 location 都重复声明这三项
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源 immutable 缓存（Vite 带 hash）
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 反代
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 透传真实客户端 IP：后端 trust proxy=1 后按真实 IP 做匿名限流分桶
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 反代读超时：AI 问答后端 LLM 超时为 60s，这里放大到 75s，
        # 避免慢模型（思考型 / MiniMax 等）被 Nginx 60s 截断成 504 → 前台误判 AI 不可用（r89）
        proxy_read_timeout 75s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 图片直连 MinIO 公共桶：objectKey 含日期与 uuid、内容不可变 → 7 天强缓存 + 安全头
    location /img/ {
        proxy_pass http://minio:9000/dafu-images/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 入口页禁止缓存（防止浏览器启发式缓存旧 index.html → 加载已删除的旧 chunk）
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 兜底（fallback 命中的 /index.html 同样带 no-cache）
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
