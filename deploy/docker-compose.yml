# 大福食刻 · 服务器编排（离线镜像，不在服务器构建）
# 用法：把整个 deploy 目录上传到服务器，docker load 后 docker compose up -d
name: dafu

services:
    mysql:
        image: mysql:8.0
        container_name: dafu-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            TZ: Asia/Shanghai
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
        volumes:
            - mysql-data:/var/lib/mysql
            - ./sql:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        container_name: dafu-redis
        restart: unless-stopped
        # 开 AOF，数据落 redis-data 卷，重启不丢
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    minio:
        image: minio/minio:latest
        container_name: dafu-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 20

    matting:
        image: dafu-matting:${DAFU_TAG:-v1.0-alpha}
        container_name: dafu-matting
        restart: unless-stopped
        # 默认不启动：2G 内存机器上抠图会 OOM；需要时 --profile matting 单独拉起
        profiles: ["matting"]
        environment:
            TZ: Asia/Shanghai
            MATTING_MODEL: u2net    # 质量优先；实测批量峰值约 1.39GB，2G 机器需配 2GB swap
        volumes:
            # 具名卷，Linux 上不再依赖 USERPROFILE；首次启动联网下载 u2net（约 168MB）
            - u2net-models:/models
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
            interval: 10s
            timeout: 6s
            retries: 30
            start_period: 15s

    backend:
        image: dafu-backend:${DAFU_TAG:-v1.0-alpha}
        container_name: dafu-backend
        restart: unless-stopped
        environment:
            PORT: "3000"
            MATTING_URL: http://matting:8000
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            REDIS_HOST: redis
            REDIS_PORT: "6379"
            MINIO_HOST: minio
            MINIO_PORT: "9000"
            MINIO_USER: ${MINIO_USER}
            MINIO_PASSWORD: ${MINIO_PASSWORD}
            MINIO_BUCKET: ${MINIO_BUCKET}
            JWT_SECRET: ${JWT_SECRET}
            AI_ENC_KEY: ${AI_ENC_KEY}
            AI_BASE_URL: ${AI_BASE_URL:-}
            AI_API_KEY: ${AI_API_KEY:-}
            AI_MODEL: ${AI_MODEL:-}
            # 福大 CAS 双模式：BASE_URL 与 SERVICE 均配置 → 真实 CAS 3.0；留空 → 演示桩模式
            FZU_CAS_BASE_URL: ${FZU_CAS_BASE_URL:-}
            FZU_CAS_SERVICE: ${FZU_CAS_SERVICE:-}
            FZU_CAS_VALIDATE_PATH: ${FZU_CAS_VALIDATE_PATH:-/serviceValidate}
            # 演示桩统一初始口令：公网暴露必须改成不公开的强口令
            FZU_CAS_INITIAL_PASSWORD: ${FZU_CAS_INITIAL_PASSWORD:-FZU521}
            # 调试通道固定关闭：验证码接口不返回 debugCode（生产/公网务必保持 false）
            DEBUG: "false"
            TZ: Asia/Shanghai
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy

    frontend:
        image: dafu-frontend:${DAFU_TAG:-v1.0-alpha}
        container_name: dafu-frontend
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "8095:80"

volumes:
    mysql-data:
    minio-data:
    redis-data:
    u2net-models:
